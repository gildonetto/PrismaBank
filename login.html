<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma Bank | Entrar</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Mesmo visual do cadastro: fonte, style-1.css e cadastro.css -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/style-1.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <!-- Só o formulário, no meio da tela. Ao entrar, vai para o banco (index.html) -->
    <main>
        <div class="logo"><img src="favicon.svg" alt="" width="32" height="32"> Prisma Bank</div>

        <h1>Entrar</h1>

        <form action="index.html">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" required>

            <button class="botao">Entrar</button>
        </form>

        <p>Não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </main>

</body>
</html>
